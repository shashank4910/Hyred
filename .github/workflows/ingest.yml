name: Daily ingest

on:
  schedule:
    # Every 6 hours: 00:30, 06:30, 12:30, 18:30 UTC
    - cron: '30 */6 * * *'
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Run ingest
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # GROQ_API_KEY is the FREE chat fallback (Llama 3.3 70B) used when
          # OpenAI's chat call fails. Embeddings are OpenAI text-embedding-3-small
          # (1536 dims) - see lib/gemini.ts. Replaced Gemini (gemini-2.0-flash
          # deprecated + free-tier 429, May 2026). Safe to keep even if unused.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          INGEST_PROFILE_EMAIL: ${{ secrets.INGEST_PROFILE_EMAIL }}
          # Cron runs on GHA (~15 min cap), not Vercel — allow more scoring time.
          INGEST_WALL_BUDGET_MS: '480000'
        run: npm run ingest
