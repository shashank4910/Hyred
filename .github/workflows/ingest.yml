name: Daily ingest

on:
  schedule:
    # Every 6 hours: 00:30, 06:30, 12:30, 18:30 UTC
    - cron: '30 */6 * * *'
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Scans EVERY onboarded profile sequentially, and each profile can use up
    # to INGEST_WALL_BUDGET_MS (8 min). 15 onboarded profiles x 8 min = 120 min
    # of work. A 40-min cap killed the job mid-loop (the newest profiles were
    # ordered last and never got scanned). 180 min covers ~22 profiles and
    # leaves margin; private repos allow up to 35 days per job.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Run ingest
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # OPENROUTER_API_KEY is the ONLY chat provider (prepaid credit) and
          # also serves embeddings (text-embedding-3-small via OpenRouter's
          # OpenAI-compatible endpoint - see lib/gemini.ts). Groq/Gemini/
          # Cerebras/Bluesminds were removed Aug 2026 (Session 49): every
          # fallback tier was dead or 429ing, and chain fall-through made calls
          # slow and flaky. OpenAI key below is the paid last resort.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          # Do NOT pass INGEST_PROFILE_EMAIL here. That secret is owner-only
          # debug: if set, cron scans one mailbox and skips every other user.
          # Cron runs on GHA (~40 min cap), not Vercel — allow more scoring time.
          INGEST_WALL_BUDGET_MS: '480000'
        run: npm run ingest
